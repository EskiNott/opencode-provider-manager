name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  secret-pattern-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject common live-key patterns
        shell: bash
        run: |
          if git grep -nE 'sk-[A-Za-z0-9_-]{24,}' -- ':!*.md' ':!tests/**'; then
            echo 'Potential live API credential found.'
            exit 1
          fi
